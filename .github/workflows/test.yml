name: Tests

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/main.yml'
      - '.github/workflows/omjl.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/main.yml'
      - '.github/workflows/omjl.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # the coverage badge file on gh-pages
      actions: write  # julia-actions/cache deletes the caches it replaces
    strategy:
      fail-fast: false
      matrix:
        version: ['1.13']
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - name: Add registries
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.Registry.add("General")
          Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/OpenModelica/OpenModelicaRegistry.git"))

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      # The coverage in the job summary and, on master, coverage.json on gh-pages for the README's badge (no external
      # service; the action is shared by the OM.jl packages).
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src

      - name: Coverage
        uses: JKRT/OM.jl/.github/actions/coverage@master
        with:
          name: MetaModelica.jl/src
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
