name: TagBot

# Tags and releases a version after its registration is merged (JuliaRegistries/TagBot).
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: write  # dispatch main.yml at the new tag
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # A tag created with the workflow's token starts no other workflow, so the docs
      # workflow's tag trigger does not fire. A workflow_dispatch is exempt: build the docs
      # at the latest release tag, and Documenter deploys vX.Y.Z and stable.
      - name: Versioned docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$TAG" ]; then
            gh workflow run main.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          fi
